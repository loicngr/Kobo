name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate and prepare the exact release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      node: ${{ steps.package.outputs.node }}
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require main
        run: test "$GITHUB_REF_NAME" = main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/client/package-lock.json
            src/client/src-pwa/package-lock.json
      - name: Install pinned secret scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan history and current source with redacted findings
        env:
          GITLEAKS_BINARY: ${{ runner.temp }}/gitleaks
        run: node scripts/scan-secrets.mjs
      - run: npm ci
      - run: npm ci
        working-directory: src/client
      - run: npm ci
        working-directory: src/client/src-pwa
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: src/client
      - run: npm audit --audit-level=high
        working-directory: src/client/src-pwa
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run typecheck:tests
      - run: npm run type-check
        working-directory: src/client
      - run: npm run test:all
      - run: npm run build
      - name: Pack and verify
        id: package
        run: |
          echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          mv release/*.tgz release/package.tgz
          node scripts/smoke-package.mjs release/package.tgz
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum release/package.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.run_id }}
          path: release/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the validated tarball
    needs: prepare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ needs.prepare.outputs.node }}
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.run_id }}
          path: release
      - name: Verify artifact and release availability
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_SHA256: ${{ needs.prepare.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s  %s\n' "$EXPECTED_SHA256" release/package.tgz | sha256sum --check
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo 'Release tag already exists; choose a new version.' >&2
            exit 1
          fi
          if npm view "@loicngr/kobo@$VERSION" version >/dev/null 2>&1; then
            echo 'Package version already exists; choose a new version.' >&2
            exit 1
          fi
      - name: Publish without rebuilding or running package lifecycle hooks
        run: npm publish release/package.tgz --ignore-scripts --provenance --access public
      - name: Create tag and GitHub release for the validated source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes release/package.tgz
