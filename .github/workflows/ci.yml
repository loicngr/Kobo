name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  check:
    name: Lint, type check and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: src/client
        run: npm ci

      - name: Audit root dependencies
        run: npm audit --audit-level=high

      - name: Audit client dependencies
        working-directory: src/client
        # --omit=dev: remaining high-severity findings are transitive dev/build
        # tooling only (@vue/test-utils, @quasar/app-vite's archiver chain), not
        # shipped in the production bundle — see Makefile's audit-client target.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint (biome)
        run: npm run lint

      - name: Type check (server)
        run: npx tsc --noEmit

      - name: Run backend tests
        run: npm test

      - name: Run frontend tests
        working-directory: src/client
        run: npm test
